<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Curriculum | RobotLearn</title><link rel="stylesheet" href="css/style.css"></head><body><nav class="navbar"><div class="container nav-container"><a class="logo" href="index.html">🤖 Robot<span>Learn</span></a><button class="menu-toggle">☰</button><ul class="nav-links"><li><a href="index.html">Home</a></li><li><a href="curriculum.html">Curriculum</a></li><li><a href="instructor.html">Instructor</a></li><li><a href="applications.html">Applications</a></li><li><a href="quiz.html">Quiz</a></li><li><a href="dashboard.html">Dashboard</a></li><li><a href="contact.html">Contact</a></li></ul><div class="nav-actions"><button class="theme-toggle">◐</button><a class="btn btn-primary" href="enroll.html">Start Learning</a></div></div></nav><header class="page-hero"><div class="container"><h1>Course curriculum</h1><p>12 guided modules, 50 lessons, and persistent progress.</p></div></header><main class="section"><div class="container"><div class="card"><b>Course progress: <span data-progress>0%</span></b><div class="progress-wrap"><div class="progress-bar"></div></div><p class="muted"><span data-completed>0</span> / 50 lessons completed</p></div><div id="modules"></div></div></main><div class="modal hidden" id="lessonModal"><div class="modal-content"></div></div><script src="js/script.js"></script><script>const M=[['Introduction to Robotics',['What is Robotics?','History of robotics','Types of robots','Robot components']],['Robot Architecture',['Perception layer','Processing layer','Decision making','Control layer']],['Sensors',['Sensors overview','Distance sensors','Vision sensors','IMU and environmental sensors']],['Actuators and Motors',['Motors and servos','Stepper motors','Motor drivers','Actuator selection']],['Microcontrollers',['Arduino basics','ESP32 foundations','Raspberry Pi','Choosing a controller']],['Embedded Systems',['Embedded systems','Real-time operation','Input and output','System integration']],['Robot Communication',['Robot communication','UART','I2C and SPI','CAN bus']],['Control Systems',['PID control','Feedback loops','Motor control','Tuning a controller']],['Robot Kinematics',['Kinematics','Joints and links','Forward kinematics','Motion paths']],['Artificial Intelligence in Robotics',['Artificial Intelligence in Robotics','Machine learning','Planning','Edge computing']],['Computer Vision and Autonomous Robots',['Computer vision','Navigation','Path planning','Obstacle avoidance']],['Real-World Robotics Projects',['Obstacle robot','Line follower','Robotic arm','Autonomous rover']];modules.innerHTML=M.map((m,i)=>`<details class="module"><summary>Module ${i+1}: ${m[0]} <span>4 lessons · ${30+i*5} min</span></summary><div class="module-body">${m[1].map(x=>`<div class="lesson"><button data-lesson="${x}">${x}</button><span>Open lesson →</span></div>`).join('')}<button class="btn btn-primary small" onclick="document.querySelectorAll('[data-lesson]')[${i*4}].click()">Start module</button></div></details>`).join('')</script></body></html>
